[package]
name = "omnimem-core"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]
name = "omnimem_core"

[dependencies]
uniffi = { version = "0.28", features = ["cli"] }
tokio = { version = "1.0", features = ["rt", "macros", "sync"] }
uniffi_bindgen = "0.28.3"
thiserror = "2.0.18"
reqwest = { version = "0.12", features = ["json", "rustls-tls", "multipart", "blocking"], default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"

[build-dependencies]
uniffi = { version = "0.28", features = ["build"] }
uniffi_bindgen = "0.31.0"
